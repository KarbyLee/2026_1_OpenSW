<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>캘린더 꾸미기</title>
  <link rel="stylesheet" href="decorate.css">
</head>
<body>

  <div class="page-header">
    <h1 class="page-title">캘린더 꾸미기</h1>
  </div>

  <div class="page">

    <!-- 왼쪽: 미리보기 캘린더 -->
    <div class="preview-wrap">
      <div class="cal" id="previewCal">
        <div class="cal-header">
          <div class="cal-arrow">‹</div>
          <h2 class="cal-title">NNNN년 N월</h2>
          <div class="cal-arrow">›</div>
        </div>
        <div class="cal-grid cal-head">
          <div class="sun">일</div>
          <div>월</div><div>화</div><div>수</div><div>목</div><div>금</div>
          <div class="sat">토</div>
        </div>
        <div class="cal-grid cal-body" id="previewBoard"></div>
      </div>
    </div>

    <!-- 오른쪽: 꾸미기 사이드바 -->
    <aside class="deco-sidebar">
      <div class="deco-top">
        <h2 class="deco-title">꾸미기 요소</h2>

        <!-- 폰트 섹션 -->
        <section class="deco-section">
          <h3 class="deco-section-title">폰트</h3>
          <div class="deco-divider"></div>

          <div class="deco-row">
            <label class="deco-label">폰트 종류</label>
            <select class="deco-select" id="fontFamily">
              <option value="'Pretendard', sans-serif" style="font-family:'Pretendard',sans-serif">기본</option>
              <option value="'NanumMyeongjo', serif" style="font-family:'NanumMyeongjo',serif">나눔명조</option>
              <option value="'GraceSerif', serif" style="font-family:'GraceSerif',serif">우아한 셰리프</option>
              <option value="'MonaS12TextKR', sans-serif" style="font-family:'MonaS12TextKR',sans-serif">Mona12</option>
            </select>
          </div>

          <div class="deco-row">
            <label class="deco-label">폰트 색상</label>


            <div class="toggle-group">
              <button class="toggle-header" data-target="fontPanel-title">
                <span class="toggle-dot" id="dot-title" style="background:#222222"></span>
                타이틀
                <span class="toggle-arrow">▾</span>
              </button>
              <div class="toggle-panel" id="fontPanel-title">
                <div class="color-picker-wrap">
                  <div class="rgb-box-wrap">
                    <div class="rgb-gradient-box" id="fontRgbBox-title">
                      <div class="rgb-white-overlay"></div>
                      <div class="rgb-black-overlay"></div>
                      <div class="rgb-cursor" id="fontRgbCursor-title"></div>
                    </div>
                    <input type="range" class="hue-slider" id="fontHue-title" min="0" max="360" value="0">
                  </div>
                  <div class="hex-row">
                    <span class="hex-label">#</span>
                    <input type="text" class="hex-input" id="fontHex-title" maxlength="6" placeholder="222222">
                    <div class="color-preview-dot" id="fontDot-title"></div>
                  </div>
                  <button class="reset-btn" data-key="title" data-default="222222">초기화</button>
                </div>
              </div>
            </div>
            <div class="toggle-group">
              <button class="toggle-header" data-target="fontPanel-week">
                <span class="toggle-dot" id="dot-week" style="background:#222222"></span>
                평일
                <span class="toggle-arrow">▾</span>
              </button>
              <div class="toggle-panel" id="fontPanel-week">
                <div class="color-picker-wrap">
                  <div class="rgb-box-wrap">
                    <div class="rgb-gradient-box" id="fontRgbBox-week">
                      <div class="rgb-white-overlay"></div>
                      <div class="rgb-black-overlay"></div>
                      <div class="rgb-cursor" id="fontRgbCursor-week"></div>
                    </div>
                    <input type="range" class="hue-slider" id="fontHue-week" min="0" max="360" value="0">
                  </div>
                  <div class="hex-row">
                    <span class="hex-label">#</span>
                    <input type="text" class="hex-input" id="fontHex-week" maxlength="6" placeholder="222222">
                    <div class="color-preview-dot" id="fontDot-week"></div>
                  </div>
                  <button class="reset-btn" data-key="week" data-default="222222">초기화</button>
                </div>
              </div>
            </div>

            <div class="toggle-group">
              <button class="toggle-header" data-target="fontPanel-sat">
                <span class="toggle-dot" id="dot-sat" style="background:#1b6ae3"></span>
                토요일
                <span class="toggle-arrow">▾</span>
              </button>
              <div class="toggle-panel" id="fontPanel-sat">
                <div class="color-picker-wrap">
                  <div class="rgb-box-wrap">
                    <div class="rgb-gradient-box" id="fontRgbBox-sat">
                      <div class="rgb-white-overlay"></div>
                      <div class="rgb-black-overlay"></div>
                      <div class="rgb-cursor" id="fontRgbCursor-sat"></div>
                    </div>
                    <input type="range" class="hue-slider" id="fontHue-sat" min="0" max="360" value="210">
                  </div>
                  <div class="hex-row">
                    <span class="hex-label">#</span>
                    <input type="text" class="hex-input" id="fontHex-sat" maxlength="6" placeholder="1b6ae3">
                    <div class="color-preview-dot" id="fontDot-sat"></div>
                  </div>
                  <button class="reset-btn" data-key="sat" data-default="1b6ae3">초기화</button>
                </div>
              </div>
            </div>

            <div class="toggle-group">
              <button class="toggle-header" data-target="fontPanel-sun">
                <span class="toggle-dot" id="dot-sun" style="background:#e31b20"></span>
                일요일 / 공휴일
                <span class="toggle-arrow">▾</span>
              </button>
              <div class="toggle-panel" id="fontPanel-sun">
                <div class="color-picker-wrap">
                  <div class="rgb-box-wrap">
                    <div class="rgb-gradient-box" id="fontRgbBox-sun">
                      <div class="rgb-white-overlay"></div>
                      <div class="rgb-black-overlay"></div>
                      <div class="rgb-cursor" id="fontRgbCursor-sun"></div>
                    </div>
                    <input type="range" class="hue-slider" id="fontHue-sun" min="0" max="360" value="1">
                  </div>
                  <div class="hex-row">
                    <span class="hex-label">#</span>
                    <input type="text" class="hex-input" id="fontHex-sun" maxlength="6" placeholder="e31b20">
                    <div class="color-preview-dot" id="fontDot-sun"></div>
                  </div>
                  <button class="reset-btn" data-key="sun" data-default="e31b20">초기화</button>
                </div>
              </div>
            </div>
            <!-- 요일칸 폰트 색상 -->
            <p class="sub-section-title">요일칸 폰트 색상</p>

            <div class="toggle-group">
              <button class="toggle-header" data-target="headFontPanel-week">
                <span class="toggle-dot" id="dot-headfont-week" style="background:#ffffff"></span>
                평일
                <span class="toggle-arrow">▾</span>
              </button>
              <div class="toggle-panel" id="headFontPanel-week">
                <div class="color-picker-wrap">
                  <div class="rgb-box-wrap">
                    <div class="rgb-gradient-box" id="headFontRgbBox-week">
                      <div class="rgb-white-overlay"></div>
                      <div class="rgb-black-overlay"></div>
                      <div class="rgb-cursor" id="headFontRgbCursor-week"></div>
                    </div>
                    <input type="range" class="hue-slider" id="headFontHue-week" min="0" max="360" value="0">
                  </div>
                  <div class="hex-row">
                    <span class="hex-label">#</span>
                    <input type="text" class="hex-input" id="headFontHex-week" maxlength="6" placeholder="ffffff">
                    <div class="color-preview-dot" id="headFontDot-week"></div>
                  </div>
                  <button class="reset-btn" data-key="headfont-week" data-default="ffffff">초기화</button>
                </div>
              </div>
            </div>

            <div class="toggle-group">
              <button class="toggle-header" data-target="headFontPanel-sat">
                <span class="toggle-dot" id="dot-headfont-sat" style="background:#ffffff"></span>
                토요일
                <span class="toggle-arrow">▾</span>
              </button>
              <div class="toggle-panel" id="headFontPanel-sat">
                <div class="color-picker-wrap">
                  <div class="rgb-box-wrap">
                    <div class="rgb-gradient-box" id="headFontRgbBox-sat">
                      <div class="rgb-white-overlay"></div>
                      <div class="rgb-black-overlay"></div>
                      <div class="rgb-cursor" id="headFontRgbCursor-sat"></div>
                    </div>
                    <input type="range" class="hue-slider" id="headFontHue-sat" min="0" max="360" value="0">
                  </div>
                  <div class="hex-row">
                    <span class="hex-label">#</span>
                    <input type="text" class="hex-input" id="headFontHex-sat" maxlength="6" placeholder="ffffff">
                    <div class="color-preview-dot" id="headFontDot-sat"></div>
                  </div>
                  <button class="reset-btn" data-key="headfont-sat" data-default="ffffff">초기화</button>
                </div>
              </div>
            </div>

            <div class="toggle-group">
              <button class="toggle-header" data-target="headFontPanel-sun">
                <span class="toggle-dot" id="dot-headfont-sun" style="background:#ffffff"></span>
                일요일
                <span class="toggle-arrow">▾</span>
              </button>
              <div class="toggle-panel" id="headFontPanel-sun">
                <div class="color-picker-wrap">
                  <div class="rgb-box-wrap">
                    <div class="rgb-gradient-box" id="headFontRgbBox-sun">
                      <div class="rgb-white-overlay"></div>
                      <div class="rgb-black-overlay"></div>
                      <div class="rgb-cursor" id="headFontRgbCursor-sun"></div>
                    </div>
                    <input type="range" class="hue-slider" id="headFontHue-sun" min="0" max="360" value="0">
                  </div>
                  <div class="hex-row">
                    <span class="hex-label">#</span>
                    <input type="text" class="hex-input" id="headFontHex-sun" maxlength="6" placeholder="ffffff">
                    <div class="color-preview-dot" id="headFontDot-sun"></div>
                  </div>
                  <button class="reset-btn" data-key="headfont-sun" data-default="ffffff">초기화</button>
                </div>
              </div>
            </div>
          </div>

        </section>

        <div class="deco-divider"></div>

        <!-- 요일 칸 섹션 -->
        <section class="deco-section">
          <h3 class="deco-section-title">요일 칸</h3>
          <div class="deco-divider"></div>

          <div class="deco-row">
            <!-- 평일 -->
            <div class="toggle-group">
              <button class="toggle-header" data-target="headPanel-week">
                <span class="toggle-dot" id="dot-head-week" style="background:#333333"></span>
                평일
                <span class="toggle-arrow">▾</span>
              </button>
              <div class="toggle-panel" id="headPanel-week">
                <div class="color-picker-wrap">
                  <div class="rgb-box-wrap">
                    <div class="rgb-gradient-box" id="headRgbBox-week">
                      <div class="rgb-white-overlay"></div>
                      <div class="rgb-black-overlay"></div>
                      <div class="rgb-cursor" id="headRgbCursor-week"></div>
                    </div>
                    <input type="range" class="hue-slider" id="headHue-week" min="0" max="360" value="0">
                  </div>
                  <div class="hex-row">
                    <span class="hex-label">#</span>
                    <input type="text" class="hex-input" id="headHex-week" maxlength="6" placeholder="333333">
                    <div class="color-preview-dot" id="headDot-week"></div>
                  </div>
                  <button class="reset-btn" data-key="head-week" data-default="333333">초기화</button>
                </div>
              </div>
            </div>

            <!-- 토요일 -->
            <div class="toggle-group">
              <button class="toggle-header" data-target="headPanel-sat">
                <span class="toggle-dot" id="dot-head-sat" style="background:#1b6ae3"></span>
                토요일
                <span class="toggle-arrow">▾</span>
              </button>
              <div class="toggle-panel" id="headPanel-sat">
                <div class="color-picker-wrap">
                  <div class="rgb-box-wrap">
                    <div class="rgb-gradient-box" id="headRgbBox-sat">
                      <div class="rgb-white-overlay"></div>
                      <div class="rgb-black-overlay"></div>
                      <div class="rgb-cursor" id="headRgbCursor-sat"></div>
                    </div>
                    <input type="range" class="hue-slider" id="headHue-sat" min="0" max="360" value="210">
                  </div>
                  <div class="hex-row">
                    <span class="hex-label">#</span>
                    <input type="text" class="hex-input" id="headHex-sat" maxlength="6" placeholder="1b6ae3">
                    <div class="color-preview-dot" id="headDot-sat"></div>
                  </div>
                  <button class="reset-btn" data-key="head-sat" data-default="1b6ae3">초기화</button>
                </div>
              </div>
            </div>

            <!-- 일요일 -->
            <div class="toggle-group">
              <button class="toggle-header" data-target="headPanel-sun">
                <span class="toggle-dot" id="dot-head-sun" style="background:#e31b20"></span>
                일요일
                <span class="toggle-arrow">▾</span>
              </button>
              <div class="toggle-panel" id="headPanel-sun">
                <div class="color-picker-wrap">
                  <div class="rgb-box-wrap">
                    <div class="rgb-gradient-box" id="headRgbBox-sun">
                      <div class="rgb-white-overlay"></div>
                      <div class="rgb-black-overlay"></div>
                      <div class="rgb-cursor" id="headRgbCursor-sun"></div>
                    </div>
                    <input type="range" class="hue-slider" id="headHue-sun" min="0" max="360" value="1">
                  </div>
                  <div class="hex-row">
                    <span class="hex-label">#</span>
                    <input type="text" class="hex-input" id="headHex-sun" maxlength="6" placeholder="e31b20">
                    <div class="color-preview-dot" id="headDot-sun"></div>
                  </div>
                  <button class="reset-btn" data-key="head-sun" data-default="e31b20">초기화</button>
                </div>
              </div>
            </div>
          </div>
        </section>

        <div class="deco-divider"></div>

        <!-- 백그라운드 섹션 -->
        <section class="deco-section">
          <h3 class="deco-section-title">백그라운드</h3>
          <div class="deco-divider"></div>

          <div class="deco-row">
            <label class="deco-label">배경 색상</label>

            <div class="toggle-group">
              <button class="toggle-header" data-target="bgPanel-page">
                <span class="toggle-dot" id="dot-bg" style="background:#ffffff"></span>
                전체 배경
                <span class="toggle-arrow">▾</span>
              </button>
              <div class="toggle-panel" id="bgPanel-page">
                <div class="deco-options bg-options">
                  <button class="deco-btn active" data-theme="light" data-bg="#ffffff" style="background:#ffffff; border:1.5px solid #ccc;">흰색</button>
                  <button class="deco-btn" data-theme="dark" data-bg="#000000" style="background:#000000; color:#fff;">검정</button>
                </div>
                <div class="color-picker-wrap panel-picker">
                  <div class="rgb-box-wrap">
                    <div class="rgb-gradient-box" id="bgRgbBox">
                      <div class="rgb-white-overlay"></div>
                      <div class="rgb-black-overlay"></div>
                      <div class="rgb-cursor" id="bgRgbCursor"></div>
                    </div>
                    <input type="range" class="hue-slider" id="bgHueSlider" min="0" max="360" value="0">
                  </div>
                  <div class="hex-row">
                    <span class="hex-label">#</span>
                    <input type="text" class="hex-input" id="bgHexInput" maxlength="6" placeholder="ffffff">
                    <div class="color-preview-dot" id="bgColorDot"></div>
                  </div>
                </div>
              </div>
            </div>

            <div class="toggle-group">
              <button class="toggle-header" data-target="bgPanel-defaultCell">
                <span class="toggle-dot" id="dot-defaultCell" style="background:#ffffff"></span>
                기본 칸
                <span class="toggle-arrow">▾</span>
              </button>
              <div class="toggle-panel" id="bgPanel-defaultCell">
                <div class="color-picker-wrap">
                  <div class="rgb-box-wrap">
                    <div class="rgb-gradient-box" id="defaultCellRgbBox">
                      <div class="rgb-white-overlay"></div>
                      <div class="rgb-black-overlay"></div>
                      <div class="rgb-cursor" id="defaultCellRgbCursor"></div>
                    </div>
                    <input type="range" class="hue-slider" id="defaultCellHueSlider" min="0" max="360" value="0">
                  </div>
                  <div class="hex-row">
                    <span class="hex-label">#</span>
                    <input type="text" class="hex-input" id="defaultCellHexInput" maxlength="6" placeholder="ffffff">
                    <div class="color-preview-dot" id="defaultCellColorDot"></div>
                  </div>
                  <button class="reset-btn" data-key="defaultCell" data-default="ffffff">초기화</button>
                </div>
              </div>
            </div>

            <div class="toggle-group">
              <button class="toggle-header" data-target="bgPanel-otherCell">
                <span class="toggle-dot" id="dot-otherCell" style="background:#969696"></span>
                이전 달 / 다음 달 칸
                <span class="opacity-badge" id="otherOpacityBadge">30%</span>
                <span class="toggle-arrow">▾</span>
              </button>
              <div class="toggle-panel" id="bgPanel-otherCell">
                <div class="color-picker-wrap">
                  <div class="rgb-box-wrap">
                    <div class="rgb-gradient-box" id="otherRgbBox">
                      <div class="rgb-white-overlay"></div>
                      <div class="rgb-black-overlay"></div>
                      <div class="rgb-cursor" id="otherRgbCursor"></div>
                    </div>
                    <input type="range" class="hue-slider" id="otherHueSlider" min="0" max="360" value="0">
                  </div>
                  <div class="hex-row">
                    <span class="hex-label">#</span>
                    <input type="text" class="hex-input" id="otherHexInput" maxlength="6" placeholder="969696">
                    <div class="color-preview-dot" id="otherColorDot"></div>
                  </div>
                  <div class="opacity-row">
                    <label class="opacity-label" for="otherOpacity">불투명도</label>
                    <input type="range" class="opacity-slider" id="otherOpacity" min="0" max="100" value="30">
                  </div>
                  <button class="reset-btn" data-key="other" data-default="969696">초기화</button>
                </div>
              </div>
            </div>

            <div class="toggle-group">
              <button class="toggle-header" data-target="bgPanel-highlight">
                <span class="toggle-dot" id="dot-highlight" style="background:#646464"></span>
                하이라이트 표시
                <span class="opacity-badge" id="highlightOpacityBadge">13%</span>
                <span class="toggle-arrow">▾</span>
              </button>
              <div class="toggle-panel" id="bgPanel-highlight">
                <div class="color-picker-wrap">
                  <div class="rgb-box-wrap">
                    <div class="rgb-gradient-box" id="highlightRgbBox">
                      <div class="rgb-white-overlay"></div>
                      <div class="rgb-black-overlay"></div>
                      <div class="rgb-cursor" id="highlightRgbCursor"></div>
                    </div>
                    <input type="range" class="hue-slider" id="highlightHueSlider" min="0" max="360" value="0">
                  </div>
                  <div class="hex-row">
                    <span class="hex-label">#</span>
                    <input type="text" class="hex-input" id="highlightHexInput" maxlength="6" placeholder="646464">
                    <div class="color-preview-dot" id="highlightColorDot"></div>
                  </div>
                  <div class="opacity-row">
                    <label class="opacity-label" for="highlightOpacity">불투명도</label>
                    <input type="range" class="opacity-slider" id="highlightOpacity" min="0" max="100" value="13">
                  </div>
                  <button class="reset-btn" data-key="highlight" data-default="646464">초기화</button>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- 이미지 섹션 -->
        <section class="deco-section" id="bgImageSection">
          <h3 class="deco-section-title">이미지</h3>
          <div class="deco-divider"></div>
          <p class="sub-section-title">배경 이미지</p>

          <!-- 이미지 없을 때: 업로드 버튼 -->
          <div id="bgImageUploadArea">
            <label class="bg-img-upload-btn" for="bgImageInput">
              <span class="bg-img-upload-icon">🖼️</span>
              <span>이미지 삽입</span>
            </label>
            <input type="file" id="bgImageInput" accept="image/*" style="display:none">
            <p class="bg-img-hint">배경 레이어에 이미지를 추가합니다</p>
          </div>

          <!-- 이미지 있을 때: 컨트롤 패널 -->
          <div id="bgImageControls" style="display:none">
            <div class="bg-img-thumb-row">
              <img id="bgImageThumb" class="bg-img-thumb" src="" alt="배경 이미지">
              <button class="bg-img-remove-btn" id="bgImageRemove" title="이미지 제거">✕</button>
            </div>

            <div class="deco-divider" style="margin:0.6rem 0"></div>

            <!-- 크기 -->
            <div class="sub-section-title">크기</div>
            <div class="bg-img-size-row">
              <div class="bg-img-size-field">
                <label class="deco-label">너비 (%)</label>
                <div class="size-input-wrap">
                  <input type="number" class="size-input" id="bgImgWidth" value="100" min="10" max="500">
                  <div class="size-btns">
                    <button class="size-btn" id="bgImgWidthUp">▲</button>
                    <button class="size-btn" id="bgImgWidthDown">▼</button>
                  </div>
                </div>
              </div>
              <div class="bg-img-size-field">
                <label class="deco-label">높이 (%)</label>
                <div class="size-input-wrap">
                  <input type="number" class="size-input" id="bgImgHeight" value="100" min="10" max="500">
                  <div class="size-btns">
                    <button class="size-btn" id="bgImgHeightUp">▲</button>
                    <button class="size-btn" id="bgImgHeightDown">▼</button>
                  </div>
                </div>
              </div>
            </div>
            <label class="bg-img-lock-row">
              <input type="checkbox" id="bgImgLock" checked>
              <span class="deco-label" style="margin:0">가로세로 비율 고정</span>
            </label>

            <div class="deco-divider" style="margin:0.6rem 0"></div>

            <!-- 위치 -->
            <div class="sub-section-title">위치</div>
            <div class="bg-img-size-row">
              <div class="bg-img-size-field">
                <label class="deco-label">X (%)</label>
                <div class="size-input-wrap">
                  <input type="number" class="size-input" id="bgImgX" value="50" min="-200" max="200">
                  <div class="size-btns">
                    <button class="size-btn" id="bgImgXUp">▲</button>
                    <button class="size-btn" id="bgImgXDown">▼</button>
                  </div>
                </div>
              </div>
              <div class="bg-img-size-field">
                <label class="deco-label">Y (%)</label>
                <div class="size-input-wrap">
                  <input type="number" class="size-input" id="bgImgY" value="50" min="-200" max="200">
                  <div class="size-btns">
                    <button class="size-btn" id="bgImgYUp">▲</button>
                    <button class="size-btn" id="bgImgYDown">▼</button>
                  </div>
                </div>
              </div>
            </div>

            <div class="deco-divider" style="margin:0.6rem 0"></div>

            <!-- 불투명도 -->
            <div class="sub-section-title">불투명도</div>
            <div class="opacity-row">
              <label class="opacity-label" for="bgImgOpacity">불투명도 <span class="opacity-badge" id="bgImgOpacityBadge">100%</span></label>
              <input type="range" class="opacity-slider" id="bgImgOpacity" min="0" max="100" value="100">
            </div>

            <div class="deco-divider" style="margin:0.6rem 0"></div>

            <!-- 이미지 변경 버튼 -->
            <label class="bg-img-change-btn" for="bgImageChange">이미지 변경</label>
            <input type="file" id="bgImageChange" accept="image/*" style="display:none">
          </div>

          <div class="deco-divider"></div>
          <p class="sub-section-title">스티커 이미지</p>
          <label class="bg-img-upload-btn" for="stickerImageInput">
            <span>스티커 추가</span>
          </label>
          <input type="file" id="stickerImageInput" accept="image/*" multiple style="display:none">
          <p class="bg-img-hint">배경 이미지를 포함해 최대 5개까지 추가할 수 있습니다</p>

          <div class="sticker-list" id="stickerList"></div>

          <div class="sticker-editor" id="stickerEditor" style="display:none">
            <div class="sub-section-title">선택한 스티커 수정</div>
            <div class="bg-img-size-row">
              <div class="bg-img-size-field">
                <label class="deco-label" for="stickerWidth">너비 (%)</label>
                <input type="number" class="size-input" id="stickerWidth" min="2" max="300">
              </div>
              <div class="bg-img-size-field">
                <label class="deco-label" for="stickerHeight">높이 (%)</label>
                <input type="number" class="size-input" id="stickerHeight" min="2" max="300">
              </div>
            </div>
            <div class="bg-img-size-row">
              <div class="bg-img-size-field">
                <label class="deco-label" for="stickerX">X (%)</label>
                <input type="number" class="size-input" id="stickerX" min="-100" max="200">
              </div>
              <div class="bg-img-size-field">
                <label class="deco-label" for="stickerY">Y (%)</label>
                <input type="number" class="size-input" id="stickerY" min="-100" max="200">
              </div>
            </div>
            <div class="opacity-row">
              <label class="opacity-label" for="stickerOpacity">불투명도 <span class="opacity-badge" id="stickerOpacityBadge">100%</span></label>
              <input type="range" class="opacity-slider" id="stickerOpacity" min="0" max="100" value="100">
            </div>
            <button class="reset-btn sticker-delete-btn" id="stickerDelete" type="button">선택한 스티커 삭제</button>
          </div>
        </section>

        <div class="deco-divider"></div>
      </div>

      <div class="deco-actions">
        <button class="deco-save" id="btnDecoSave">스타일 불러오기</button>
        <button class="deco-apply" id="btnDecoApply" type="button">적용</button>
        <button class="deco-exit" id="btnDecoExit">나가기</button>
      </div>
    </aside>
  </div>

  <!-- 확인 모달 -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <p class="confirm-msg" id="confirmMsg">적용하시겠습니까?</p>
      <div class="confirm-btns" id="confirmBtns">
        <button class="confirm-yes" id="confirmYes">예</button>
        <button class="confirm-no"  id="confirmNo">아니요</button>
      </div>
    </div>
  </div>

  <script src="decorate.js"></script>
</body>
</html>
