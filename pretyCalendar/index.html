<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Desktop Calendar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 옵션 아이콘 (전체 화면 왼쪽 상단 고정) -->
    <img src="Images/optionIcon.png" class="option-icon" id="optionIcon" alt="메뉴">

    <!-- 사이드바 오버레이 -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- 사이드바 -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">메뉴</span>
        </div>
        <ul class="sidebar-menu">
            <li onclick="location.href='decorate.html'">🎨 캘린더 꾸미기</li>
            <li id="placeWidgetButton">바탕화면에 배치하기</li>
        </ul>
    </div>

    <!-- 캘린더 본체 -->
    <div class="widget-statusbar" id="widgetStatusbar">
        <div class="widget-option-wrap">
            <button class="widget-status-button" id="widgetOptionButton" type="button" aria-label="옵션">
                <img src="Images/optionIcon.png" alt="">
            </button>
            <div class="widget-option-menu" id="widgetOptionMenu">
                <div class="widget-option-title">위젯 크기 조절</div>
                <div class="widget-size-options">
                    <button type="button" data-widget-size="large">크게</button>
                    <button type="button" data-widget-size="medium">중간</button>
                    <button type="button" data-widget-size="small">작게</button>
                </div>
                <button class="widget-open-app" id="widgetOpenApp" type="button">앱으로 이동</button>
            </div>
        </div>
        <button class="widget-status-button widget-delete-button" id="widgetDeleteButton" type="button" aria-label="위젯 삭제">
            <img src="Images/exitIcon.png" alt="">
        </button>
    </div>

    <div class="rap">
        <div class="header">
            <button class="cal-arrow prevDay" type="button">‹</button>
            <h2 class="dateTitle"></h2>
            <button class="cal-arrow nextDay" type="button">›</button>
        </div>

        <div class="grid dateHead">
            <div class="sun">일</div>
            <div>월</div><div>화</div><div>수</div><div>목</div><div>금</div>
            <div class="sat">토</div>
        </div>

        <div class="grid dateBoard"></div>
    </div>

    <!-- 메모 모달 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-date" id="modalDate"></h3>
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            <textarea class="memo-input" id="memoInput" placeholder="메모를 입력하세요..."></textarea>
            <div class="modal-actions">
                <button class="btn-delete" id="btnDelete">삭제</button>
                <button class="btn-save" id="btnSave">저장</button>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
